name: Build SystemUI APK

on:
  push:
    branches: [ main, develop, copilot/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Build release APK
      run: ./gradlew assembleRelease --stacktrace
      
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: SystemUI-debug
        path: build/outputs/apk/debug/SystemUI.apk
        retention-days: 30
        
    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: SystemUI-release
        path: build/outputs/apk/release/SystemUI.apk
        retention-days: 30
        
    - name: Generate build report
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Configuration" >> $GITHUB_STEP_SUMMARY
        echo "- Gradle: 8.7" >> $GITHUB_STEP_SUMMARY
        echo "- AGP: 8.5.2" >> $GITHUB_STEP_SUMMARY
        echo "- Kotlin: 1.9.24" >> $GITHUB_STEP_SUMMARY
        echo "- Target SDK: 34 (Android 14)" >> $GITHUB_STEP_SUMMARY
        echo "- Min SDK: 29 (Android 10)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f build/outputs/apk/debug/SystemUI.apk ]; then
          echo "✅ Debug APK built successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Size: $(du -h build/outputs/apk/debug/SystemUI.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Debug APK build failed" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f build/outputs/apk/release/SystemUI.apk ]; then
          echo "✅ Release APK built successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Size: $(du -h build/outputs/apk/release/SystemUI.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Release APK build failed" >> $GITHUB_STEP_SUMMARY
        fi
